<rect width="100%" height="100%" fill="#f6f8fb"/>
<rect x="28" y="22" width="1394" height="120" rx="18" fill="#ffffff" filter="url(#shadow)"/>
<text x="58" y="60" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172033" text-anchor="start">From bug proposal to validated ledger entry</text>
